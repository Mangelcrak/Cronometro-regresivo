<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro Regresivo</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">
        
        <button
            id="menuBtn"
            class="menu-btn"
            title="Menú">
            ☰
        </button>

        <!-- Pantalla completa -->
        <button
            id="fullscreenBtn"
            class="fullscreen-btn"
            title="Pantalla completa">
            ⛶
        </button>

        <h1>Cronómetro Regresivo</h1>

        <!-- Controles -->
        <section class="controls">

            <input
            type="number"
            id="minutesInput"
            min="1"
            step="1"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Minutos">

            <!-- Iniciar / Pausar -->
            <button
                id="startBtn"
                title="Iniciar o Pausar">
                ▶
            </button>

            <!-- Marca -->
            <button
                id="lapBtn"
                title="Marca">
                ⚑
            </button>

            <!-- Reset -->
            <button
                id="resetBtn"
                title="Resetear">
                ↺
            </button>

            <!-- Modo presentación -->
            <button
                id="presentationBtn"
                title="Modo presentación">
                🖥
            </button>

        </section>

        <!-- Cronómetro -->
        <section class="display">

            <div id="timer">00:00</div>

        </section>

        <!-- Marcas -->
        <section class="laps-container">

            <h2>Marcas</h2>

            <ul id="lapsList"></ul>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
